server:
  port: ${SERVER_PORT:8092}

spring:
  application:
    name: ms-pedidos360-analytics
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

app:
  kafka:
    topics:
      pedido-creado: pedidos.creados
      pedido-estado: pedidos.estado
    groups:
      dashboard: analytics-dashboard
      ventas: analytics-ventas
      auditoria: analytics-auditoria
    retry:
      interval-ms: ${KAFKA_RETRY_INTERVAL_MS:1000}
      max-attempts: ${KAFKA_MAX_RETRIES:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info
