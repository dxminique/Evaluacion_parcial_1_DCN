services:
  mysql:
    image: mysql:8.0
    environment:
      # TODO: cambiar este valor antes de usar en produccion
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: pedidos360
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Opcional: solo si necesitas conectarte desde fuera del compose para debug
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      # TODO: cambiar este usuario/clave antes de usar en produccion
      RABBITMQ_DEFAULT_USER: pedidos
      RABBITMQ_DEFAULT_PASS: 1234
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./ms-pedidos360-bff
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pedidos360
      DB_USERNAME: root
      DB_PASSWORD: 1234

  orders:
    build:
      context: ./ms-pedidos360-orders
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pedidos360
      DB_USERNAME: root
      DB_PASSWORD: 1234
      RABBITMQ_HOST: rabbitmq

  notify:
    build:
      context: ./ms-pedidos360-notify
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    environment:
      RABBITMQ_HOST: rabbitmq

  catalog:
    build:
      context: ./ms-pedidos360-catalog
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pedidos360
      DB_USERNAME: root
      DB_PASSWORD: 1234

  frontend:
    build:
      context: ./frontend-pedidos360
      args:
        VITE_API_URL: http://100.28.101.134:8083
    ports:
      - "80:80"

volumes:
  mysql_data:
  rabbitmq_data:
