services:
  mysql:
    image: mysql:8.0
    environment:
      # TODO: cambiar este valor antes de usar en produccion
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: pedidos360
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Opcional: solo si necesitas conectarte desde fuera del compose para debug
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      # TODO: cambiar este usuario/clave antes de usar en produccion
      RABBITMQ_DEFAULT_USER: pedidos
      RABBITMQ_DEFAULT_PASS: 1234
      # TODO: cambiar esta cookie antes de usar en produccion. Debe ser identica en rabbitmq y rabbitmq2.
      RABBITMQ_ERLANG_COOKIE: pedidos360clustercookie
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq2:
    image: rabbitmq:3-management
    hostname: rabbitmq2
    environment:
      RABBITMQ_DEFAULT_USER: pedidos
      RABBITMQ_DEFAULT_PASS: 1234
      RABBITMQ_ERLANG_COOKIE: pedidos360clustercookie
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
    ports:
      - "15673:15672"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    # Arranca el nodo, espera a que este listo y se une al cluster del nodo 1.
    # "|| true" en join_cluster: si el contenedor se reinicia sin perder el volumen
    # y ya esta clusterizado, join_cluster fallaria; igual se reinicia la app.
    command:
      - bash
      - -c
      - |
        rabbitmq-server -detached
        for i in $(seq 1 30); do
          rabbitmqctl await_startup -t 5 >/dev/null 2>&1 && break
          sleep 2
        done
        rabbitmqctl stop_app
        rabbitmqctl join_cluster rabbit@rabbitmq || true
        rabbitmqctl start_app
        tail -f /dev/null

  backend:
    build:
      context: ./ms-pedidos360-bff
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pedidos360
      DB_USERNAME: root
      DB_PASSWORD: 1234

  orders:
    build:
      context: ./ms-pedidos360-orders
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pedidos360
      DB_USERNAME: root
      DB_PASSWORD: 1234
      RABBITMQ_ADDRESSES: "rabbitmq:5672,rabbitmq2:5672"

  notify:
    build:
      context: ./ms-pedidos360-notify
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    restart: on-failure
    environment:
      RABBITMQ_ADDRESSES: "rabbitmq:5672,rabbitmq2:5672"

  rabbit-admin:
    build:
      context: ./ms-pedidos360-rabbit-admin
    ports:
      - "8088:8088"
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    restart: on-failure
    environment:
      RABBITMQ_ADDRESSES: "rabbitmq:5672,rabbitmq2:5672"

  catalog:
    build:
      context: ./ms-pedidos360-catalog
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pedidos360
      DB_USERNAME: root
      DB_PASSWORD: 1234

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8090:80"
    depends_on:
      catalog:
        condition: service_started
      orders:
        condition: service_started
      backend:
        condition: service_started
      rabbit-admin:
        condition: service_started
    restart: on-failure

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend-pedidos360
      args:
        VITE_API_URL: http://localhost:8083
        VITE_CATALOG_URL: http://localhost:8086
        VITE_ORDERS_URL: http://localhost:8087
    ports:
      - "80:80"

volumes:
  mysql_data:
  rabbitmq_data:
  rabbitmq2_data:
