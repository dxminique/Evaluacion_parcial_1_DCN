server.port: ${SERVER_PORT:8085}
spring:
  application.name: ms-pedidos360-report
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:report_user}
    password: ${DB_PASSWORD:report_password}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate.ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/f808e7f8-d340-4129-aa19-44b19281283a/v2.0}
