# docker-compose.kafka.yml
#
# Infraestructura de Apache Kafka para la Evaluacion Parcial 5 (DSY1107).
# Se usa SIEMPRE junto al compose principal (nunca solo), y se agrega a la
# misma red default que ya crea docker-compose.yml (no declara una red nueva).
#
# Levantar todo (los 9 contenedores de siempre + Kafka):
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d --build
#
# Bajar SOLO lo de Kafka, dejando el resto corriendo:
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml stop zookeeper kafka1 kafka2 kafka-ui kafka-admin analytics
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml rm -f zookeeper kafka1 kafka2 kafka-ui kafka-admin analytics
#
# Puertos publicados al host:
#   - kafka1:       9092 (listener PLAINTEXT_HOST)
#   - kafka2:       9094 (listener PLAINTEXT_HOST)
#   - kafka-ui:     8089
#   - kafka-admin:  8091
#   - analytics:    8092
#   zookeeper no publica ningun puerto al host (solo uso interno entre brokers).
#
# El bloque "orders" de este archivo es un OVERRIDE del servicio ya definido en
# docker-compose.yml: Compose fusiona ambos, asi que solo agrega la variable
# KAFKA_BOOTSTRAP_SERVERS sin tocar su build/ports/depends_on/demas env vars.
# A proposito NO se agrega depends_on hacia kafka1/kafka2: el stack principal
# (sin este archivo) debe seguir arrancando orders sin Kafka, exactamente igual
# que hoy. Si Kafka esta caido, orders registra el fallo por log y sigue
# publicando en RabbitMQ y respondiendo 201 igual (ver KafkaProducerConfig).

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "zookeeper-shell localhost:2181 ls / >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka1
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s

  kafka2:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka2
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    ports:
      - "9094:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    hostname: kafka-ui
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092
    ports:
      - "8089:8080"

  kafka-admin:
    build:
      context: ./ms-pedidos360-kafka-admin
    ports:
      - "8091:8091"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka1:29092,kafka2:29092"

  orders:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka1:29092,kafka2:29092"

  analytics:
    build:
      context: ./ms-pedidos360-analytics
    ports:
      - "8092:8092"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka1:29092,kafka2:29092"

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka1_data:
  kafka2_data:
