server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: ms-pedidos360-orders
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pedidos360}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/f808e7f8-d340-4129-aa19-44b19281283a/v2.0}
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:pedidos}
    password: ${RABBITMQ_PASSWORD:1234}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        # Si Kafka esta caido, que no demore la peticion: max.block.ms acota cuanto
        # puede bloquear send() esperando metadata; delivery.timeout.ms acota el total
        # de reintentos. Debe cumplirse delivery.timeout.ms >= linger.ms + request.timeout.ms
        # (linger.ms no se fija, default 0): 5000 >= 0 + 2000.
        max.block.ms: 1000
        request.timeout.ms: 2000
        delivery.timeout.ms: 5000
        spring.json.add.type.headers: false

app:
  rabbit:
    exchange: cmd.direct
    topic-exchange: evt.topic
    dead-letter-exchange: cmd.dead.dlx
    email-queue: q.cmd.email
    email-routing-key: email.send
    email-dlq: q.cmd.email.dlq
    ticket-queue: q.cmd.ticket
    ticket-routing-key: ticket.generate
    ticket-dlq: q.cmd.ticket.dlq
    stock-queue: q.evt.stock
    stock-routing-key: pedido.creado.nuevo
    stock-binding-pattern: pedido.creado.#
    stock-dlq: q.evt.stock.dlq
  kafka:
    topics:
      pedido-creado: pedidos.creados
      pedido-estado: pedidos.estado
