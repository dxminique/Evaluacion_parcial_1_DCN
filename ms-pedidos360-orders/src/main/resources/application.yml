server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: ms-pedidos360-orders
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pedidos360}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/f808e7f8-d340-4129-aa19-44b19281283a/v2.0}
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:pedidos}
    password: ${RABBITMQ_PASSWORD:1234}

app:
  rabbit:
    exchange: cmd.direct
    topic-exchange: evt.topic
    dead-letter-exchange: cmd.dead.dlx
    email-queue: q.cmd.email
    email-routing-key: email.send
    email-dlq: q.cmd.email.dlq
    ticket-queue: q.cmd.ticket
    ticket-routing-key: ticket.generate
    ticket-dlq: q.cmd.ticket.dlq
    stock-queue: q.evt.stock
    stock-routing-key: pedido.creado.nuevo
    stock-binding-pattern: pedido.creado.#
    stock-dlq: q.evt.stock.dlq
